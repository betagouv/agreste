name: Validate notifications.json

on:
  push:
    paths:
      - "notifications.json"
  pull_request:
    paths:
      - "notifications.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate notifications.json
        run: |
          python -c "
          import json, jsonschema, sys

          with open('notifications.json') as f:
              data = json.load(f)

          with open('notifications.schema.json') as f:
              schema = json.load(f)

          errors = []
          for error in jsonschema.Draft7Validator(schema).iter_errors(data):
              path = '.'.join(str(p) for p in error.absolute_path) or 'root'
              errors.append(f'{path}: {error.message}')

          for i, item in enumerate(data.get('items', [])):
              date, end_date = item.get('date', ''), item.get('end_date', '')
              if date and end_date and date > end_date:
                  errors.append(
                      f'items[{i}].date ({date}) must be on or before items[{i}].end_date ({end_date})'
                  )

          if errors:
              for error in errors:
                  print(f'❌ {error}')
              sys.exit(1)
          print('✅ notifications.json est valide !')
          "
